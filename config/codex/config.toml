model = "gpt-5.6-luna"
review_model = "gpt-5.6-terra"
project_doc_fallback_filenames = ["CLAUDE.md"] # Fallback when AGENTS.md is not present.
approval_policy = "on-request"
sandbox_mode = "danger-full-access"
tool_output_token_limit = 40000 # Higher than the default to avoid truncating large tool output.
model_reasoning_summary = "auto" # Valid values: auto, concise, detailed, none.
disable_response_storage = true
network_access = "enabled"
web_search = "live"
collaboration_mode = true
suppress_unstable_features_warning = true
plan_mode_reasoning_effort = "xhigh"

model_reasoning_effort = "max"
service_tier = "default"

# model_provider = "OpenAI"
# [model_providers.OpenAI]
# name = "OpenAI"
# base_url = "https://bench.openq.top/v1"
# wire_api = "responses"
# requires_openai_auth = true

[features]
shell_tool = true
apply_patch_freeform = true # Keep this enabled to use freeform `apply_patch`.
shell_snapshot = true
undo = true
steer = true
prevent_idle_sleep = true
unified_exec = false
requires_openai_auth = true
fast_mode = true
tool_suggest = false
hooks = true
goals = true
voice_transcription = true
terminal_resize_reflow = true
apps = false
enable_mcp_apps = false
js_repl = false

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = true # Allow access to environment entries normally excluded by default.

[shell_environment_policy.set]
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "e7fc907079d6797973cb63f97d2562c965aad8d33f52fb726005bf6702f30afc"
NODE_REPL_TRUSTED_CODE_PATHS = "/home/inm/.codex"

[sandbox_workspace_write]
network_access = true # Allow outbound network access inside the sandbox.

[tui]
notifications = true
status_line = ["model-with-reasoning", "git-branch", "context-remaining", "total-input-tokens", "total-output-tokens", "weekly-limit", "fast-mode"]
status_line_use_colors = true
vim_mode_default = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[notice]
hide_rate_limit_model_nudge = true
fast_default_opt_out = true

[agents]
max_threads = 6
max_depth = 2

